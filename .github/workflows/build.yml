name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only commits don't need a full build (tag pushes always build).
    paths-ignore: ['**.md', '.github/FUNDING.yml']
  pull_request:
    paths-ignore: ['**.md', '.github/FUNDING.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux
          - name: Windows
            os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install packaging tools
        if: runner.os == 'Linux'
        # rpm for .rpm, bsdtar (libarchive-tools) for the Arch .pacman package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: Verdigit-${{ matrix.name }}
          if-no-files-found: error
          # latest*.yml and .blockmap files are what installed copies use to auto-update.
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml

  release:
    name: Draft release
    # Only after every package has built, so a draft never appears half-uploaded
    # (publishing a partial draft would ship a release with missing files).
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with all files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "Verdigit ${GITHUB_REF_NAME#v}"
